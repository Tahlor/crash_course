name: Quality checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check leetcode/amazon/app.js
          node --check leetcode/amazon/state.js
          node --check leetcode/amazon/guided_sync.js
          node --check leetcode/amazon/practice.js
          node --check leetcode/amazon/practice_extra.js
          node --check leetcode/amazon/practice_sync.js
          node --check leetcode/amazon/code.js
          node --check leetcode/amazon/code_sync.js
          node --check leetcode/amazon/sw.js
          node --check sw.js
      - name: Check backend and deploy syntax
        run: |
          python -m py_compile server/state_api.py
          bash -n server/update_crash_course.sh
      - name: Check required course assets
        run: |
          test -f index.html
          test -f leetcode/index.html
          test -f leetcode/amazon/index.html
          test -f leetcode/amazon/practice.html
          test -f leetcode/amazon/code.html
          test -f leetcode/amazon/cheatsheet.html
          test -f leetcode/amazon/style.css
          test -f leetcode/amazon/practice.css
          test -f leetcode/amazon/code.css
          test -f leetcode/amazon/cheatsheet.css
          test -f leetcode/amazon/app.js
          test -f leetcode/amazon/state.js
          test -f leetcode/amazon/guided_sync.js
          test -f leetcode/amazon/practice.js
          test -f leetcode/amazon/practice_extra.js
          test -f leetcode/amazon/practice_sync.js
          test -f leetcode/amazon/code.js
          test -f leetcode/amazon/code_sync.js
          test -f leetcode/amazon/sw.js
          test -f server/state_api.py
          test -f server/crash-course-state.service
          test -f server/nginx-crash-course-state.conf
          test -f server/update_crash_course.sh
          test -f STATE_ARCHITECTURE.md
      - name: Check key navigation and sync links
        run: |
          grep -q 'href="amazon/"' leetcode/index.html
          grep -q 'practice.html' leetcode/amazon/app.js
          grep -q 'code.html' leetcode/amazon/app.js
          grep -q 'cheatsheet.html' leetcode/amazon/app.js
          grep -q 'guided_sync.js' leetcode/amazon/app.js
          grep -q 'practice_extra.js' leetcode/amazon/practice.html
          grep -q 'practice_sync.js' leetcode/amazon/practice.html
          grep -q 'code_sync.js' leetcode/amazon/code.html
          grep -q 'cheatsheet.html' leetcode/amazon/practice.html
          grep -q 'cheatsheet.html' leetcode/amazon/code.html
          grep -q 'index.html?review=' leetcode/amazon/practice.js
          grep -q 'index.html?review=' leetcode/amazon/code.js
          grep -q "USER_ID='default'" leetcode/amazon/state.js
          grep -q "DEFAULT_USER_ID" server/state_api.py
          grep -q 'CRASH_COURSE_PORT=8877' server/crash-course-state.service
          grep -q '127.0.0.1:8877' server/nginx-crash-course-state.conf
      - name: Check offline cache coverage
        run: |
          grep -q 'state.js' leetcode/amazon/sw.js
          grep -q 'guided_sync.js' leetcode/amazon/sw.js
          grep -q 'practice_sync.js' leetcode/amazon/sw.js
          grep -q 'code_sync.js' leetcode/amazon/sw.js
          grep -q 'practice_extra.js' leetcode/amazon/sw.js
          grep -q 'code.html' leetcode/amazon/sw.js
          grep -q 'cheatsheet.html' leetcode/amazon/sw.js
